<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Timeline 2025</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="src/styles/main.css">
</head>

<body>
    <div id="app">
        <header class="main-header">
            <div class="header-top">
                <div class="logo">
                    <svg class="header-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="8" fill="#141419" stroke="#333" />
                        <path d="M12 20H28M12 20C12 15.5817 15.5817 12 20 12M12 20C12 24.4183 15.5817 28 20 28"
                            stroke="white" stroke-width="3" stroke-linecap="round" />
                        <circle cx="28" cy="20" r="3" fill="#6366f1" />
                    </svg>
                    AI TIMELINE <span class="accent">2025</span>
                </div>
                <!-- Time Grouping (Secondary - Compact) -->
                <div class="time-controls">
                    <button class="time-btn" data-group="all">All</button>
                    <button class="time-btn active" data-group="month">Month</button>
                    <button class="time-btn" data-group="quarter">Quarter</button>
                </div>
            </div>
            <!-- Type Filter (Primary - Full Width) -->
            <div class="type-filters" id="type-filters">
                <button class="type-btn active" data-type="all">All</button>
                <button class="type-btn" data-type="model">Model</button>
                <button class="type-btn" data-type="image">Image</button>
                <button class="type-btn" data-type="video">Video</button>
                <button class="type-btn" data-type="tool">Tool</button>
                <button class="type-btn" data-type="news">News</button>
                <button class="type-btn" data-type="hardware">Hardware</button>
            </div>
        </header>

        <!-- Quick Navigation Bar -->
        <nav id="quick-nav">
            <div id="quick-nav-list">
                <!-- Javascript will populate this -->
            </div>
        </nav>

        <main id="timeline-container">
            <!-- Timeline rendering area -->

            <div id="timeline-track">
                <!-- Data nodes will be injected here -->
            </div>
        </main>

        <div id="modal-overlay" class="hidden">
            <div id="modal-content" class="glass-panel">
                <button id="modal-close">&times;</button>
                <div id="modal-body">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>
        <footer class="main-footer">
            <div class="footer-content">
                <p>&copy; 2025 <span class="brand">Tiny Flowlab</span> (작은흐름 연구소). All rights reserved.</p>
                <p class="creator">Created by <span class="highlight">Tiny</span></p>
            </div>
        </footer>
    </div>

    <!-- Data & Scripts -->
    <script src="src/data/timeline_data.js"></script>
    <script src="src/scripts/app.js"></script>
</body>

</html>
